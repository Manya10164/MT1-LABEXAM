<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #fff8f0; }
    h1 { color: #d35400; }
    table { border-collapse: collapse; width: 60%; }
    th, td { border: 1px solid #999; padding: 10px; text-align: left; }
    th { background: #f39c12; color: white; }
  </style>
</head>
<body>
  <h1>Our Menu</h1>
  <table>
    <tr><th>Food</th><th>Category</th><th>Price</th></tr>
    <tr><td>Pizza</td><td>Fast Food</td><td>250</td></tr>
    <tr><td>Burger</td><td>Fast Food</td><td>150</td></tr>
    <tr><td>Pasta</td><td>Italian</td><td>200</td></tr>
    <tr><td>Cold Coffee</td><td>Beverage</td><td>120</td></tr>
  </table>
</body>
</html>
